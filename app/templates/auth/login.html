{% extends "base.html" %}

{% block title %}Masuk - BMP Tryout{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
  <div class="card glass-card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Beasiswa Muda Purbalingga" style="width: 76px; height: 76px; object-fit: contain; margin-bottom: 0.75rem; filter: drop-shadow(0 4px 10px rgba(20, 150, 168, 0.25));">
      <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.2rem;">Selamat Datang</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Masuk ke Portal BMP CBT Tryout</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="login_input">Username atau Email</label>
        <div style="position: relative;">
          <input type="text" id="login_input" name="login_input" class="form-control" placeholder="Masukkan username atau email" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.875rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" name="remember" value="1"> Ingat saya
        </label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-weight: 600;">Lupa password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
        <i class="fas fa-sign-in-alt"></i> Masuk Sekarang
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--light-200); font-size: 0.9rem; color: var(--text-muted);">
      Belum memiliki akun peserta? 
      <a href="{{ url_for('auth.register') }}" style="font-weight: 700;">Daftar di sini</a>
    </div>
  </div>
</div>
{% endblock %}
