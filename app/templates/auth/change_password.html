{% extends "base.html" %}

{% block title %}Buat Password Baru - BMP Tryout{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
  <div class="card glass-card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="font-size: 2.5rem; color: var(--warning-500); margin-bottom: 0.5rem;"><i class="fas fa-user-lock"></i></div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.2rem;">Buat Password Baru</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">
        Halo <b>{{ current_user.full_name }}</b>, password Anda baru direset oleh admin.
        Buat password baru agar hanya Anda yang mengetahuinya.
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.change_password') }}">
      <div class="form-group">
        <label class="form-label" for="new_password">Password Baru</label>
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimal 6 karakter" minlength="6" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Ulangi Password Baru</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Ketik ulang password baru" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
        <i class="fas fa-save"></i> Simpan Password Baru
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--light-200); font-size: 0.9rem; color: var(--text-muted);">
      <a href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> Keluar</a>
    </div>
  </div>
</div>
{% endblock %}
