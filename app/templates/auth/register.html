{% extends "base.html" %}

{% block title %}Daftar Akun Peserta - BMP Tryout{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 1.5rem auto;">
  <div class="card glass-card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Beasiswa Muda Purbalingga" style="width: 76px; height: 76px; object-fit: contain; margin-bottom: 0.75rem; filter: drop-shadow(0 4px 10px rgba(20, 150, 168, 0.25));">
      <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.2rem;">Daftar Akun Peserta</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Lengkapi data diri untuk mengikuti simulasi Tryout UTBK CBT BMP</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" enctype="multipart/form-data">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="username">Username <span style="color: var(--danger-500);">*</span></label>
          <input type="text" id="username" name="username" class="form-control" placeholder="contoh: budi_utbk" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email <span style="color: var(--danger-500);">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="contoh: budi@gmail.com" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="full_name">Nama Lengkap <span style="color: var(--danger-500);">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Nama lengkap sesuai identitas" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">No. WhatsApp / HP</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="08xxxxxxxxxx">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="school">Asal Sekolah</label>
          <input type="text" id="school" name="school" class="form-control" placeholder="contoh: SMAN 1 Jakarta">
        </div>

        <div class="form-group">
          <label class="form-label" for="grade">Kelas / Jenjang</label>
          <select id="grade" name="grade" class="form-control">
            <option value="12 SMA / SMK">12 SMA / SMK</option>
            <option value="Gap Year">Gap Year / Alumni</option>
            <option value="11 SMA / SMK">11 SMA / SMK</option>
            <option value="10 SMA / SMK">10 SMA / SMK</option>
            <option value="Umum">Umum</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="photo">Foto Diri (Opsional)</label>
        <input type="file" id="photo" name="photo" class="form-control" accept="image/*">
        <small style="color: var(--text-muted); font-size: 0.8rem;">Format: JPG, PNG, WEBP (Maksimal 5MB)</small>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="password">Password <span style="color: var(--danger-500);">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimal 6 karakter" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Konfirmasi Password <span style="color: var(--danger-500);">*</span></label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Ketik ulang password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
        <i class="fas fa-user-check"></i> Buat Akun Peserta
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--light-200); font-size: 0.9rem; color: var(--text-muted);">
      Sudah memiliki akun? 
      <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Masuk di sini</a>
    </div>
  </div>
</div>
{% endblock %}
